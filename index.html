<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>文字 DNA 測驗</title>
<meta name="description" content="36 題測出你是哪一種說話的人，看看你寫字時最容易被寫成 AI 的樣子。">
<style>
:root{--bg:#fff7e8;--paper:#ffffff;--ink:#231f1a;--sub:#5d564c;--muted:#8b8276;--coral:#ff6a4d;--yellow:#ffd23f;--teal:#22b8a7;--lilac:#b9a6ff;--line:#231f1a;--soft:#fff1d6}
*{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;line-height:1.7;font-size:16px;-webkit-text-size-adjust:100%}
.wrap{max-width:640px;margin:0 auto;padding:20px 16px 72px}
.brand{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700;letter-spacing:.06em;color:var(--sub)}
.brand i{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--coral);border:2px solid var(--ink)}
.hero{display:flex;gap:14px;align-items:center;margin:14px 0 6px}
.hero svg{flex:0 0 auto}
h1{font-size:30px;line-height:1.3;margin:0;font-weight:900;letter-spacing:.01em}
h1 em{font-style:normal;color:var(--coral)}
.lead{color:var(--sub);margin:10px 0 16px}
.card{background:var(--paper);border:2.5px solid var(--line);border-radius:18px;padding:16px;margin:16px 0;box-shadow:4px 4px 0 var(--line)}
.card h2{font-size:18px;margin:0 0 8px;font-weight:900;display:flex;align-items:center;gap:8px}
.num{display:inline-flex;align-items:center;justify-content:center;min-width:28px;height:28px;border-radius:50%;background:var(--yellow);border:2px solid var(--ink);font-size:14px;font-weight:900}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:420px){.grid{grid-template-columns:1fr}}
.tile{border:2px solid var(--ink);border-radius:14px;padding:10px 12px;background:var(--soft)}
.tile b{display:block;font-size:15px}
.tile b span{color:var(--coral);margin-right:4px}
.tile small{color:var(--sub);font-size:13px;line-height:1.5;display:block}
.tile.hot{background:var(--yellow)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:2.5px solid var(--ink);border-radius:14px;background:var(--coral);color:#fff;font-size:17px;font-weight:800;padding:13px 22px;cursor:pointer;font-family:inherit;box-shadow:3px 3px 0 var(--ink);text-decoration:none;transition:transform .08s,box-shadow .08s}
.btn:active{transform:translate(3px,3px);box-shadow:0 0 0 var(--ink)}
.btn.alt{background:var(--paper);color:var(--ink)}
.btn.teal{background:var(--teal)}
.btn.full{width:100%}
.btn.off{background:#e9e2d4;color:var(--muted);cursor:default;box-shadow:none}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.small{font-size:13px;color:var(--muted)}
a{color:var(--ink)}
.qhead{display:flex;justify-content:space-between;align-items:center;font-size:14px;font-weight:700}
.progress{height:14px;background:var(--paper);border:2px solid var(--ink);border-radius:99px;overflow:hidden;margin:8px 0 16px}
.progress i{display:block;height:100%;background:var(--teal);width:0;transition:width .25s}
.tags{display:flex;gap:6px;flex-wrap:wrap}
.tag{font-size:12px;font-weight:800;border:2px solid var(--ink);border-radius:99px;padding:1px 10px;background:var(--lilac)}
.tag.s{background:var(--yellow)}
.stem{font-size:19px;font-weight:800;margin:12px 0 6px;line-height:1.55}
.opt{display:block;width:100%;text-align:left;background:var(--paper);color:var(--ink);border:2.5px solid var(--ink);border-radius:14px;padding:13px 14px;margin:10px 0;font-size:16px;font-family:inherit;cursor:pointer;line-height:1.6;box-shadow:3px 3px 0 var(--ink);transition:transform .08s,box-shadow .08s,background .1s}
.opt:hover{background:var(--soft)}
.opt.on{background:var(--yellow);transform:translate(3px,3px);box-shadow:0 0 0 var(--ink)}
.typebox{text-align:center;padding:22px 16px}
.typebox .type{font-size:30px;font-weight:900;line-height:1.3;margin:6px 0 2px}
.typebox .badge{display:inline-block;font-size:13px;font-weight:800;border:2px solid var(--ink);border-radius:99px;padding:1px 12px;background:var(--yellow);margin-top:4px}
.typebox p{margin:8px 0 0;color:#3c352c}
.bar{margin:14px 0}
.bar .lbl{display:flex;justify-content:space-between;font-size:14px;font-weight:800}
.track{position:relative;height:16px;background:var(--soft);border:2px solid var(--ink);border-radius:99px;margin:6px 12px 0}
.track em{position:absolute;left:50%;top:0;bottom:0;border-left:2px dashed var(--muted)}
.track i{position:absolute;top:50%;width:24px;height:24px;border-radius:50%;border:2.5px solid var(--ink);transform:translate(-50%,-50%)}
.bar .small{margin-top:6px}
.ai{background:var(--yellow)}
.ai h2 .num{background:var(--paper)}
ul{margin:4px 0;padding-left:20px}
table{width:100%;border-collapse:collapse;font-size:14px}
td,th{border-bottom:2px dashed #d9cfbd;padding:8px 4px;text-align:left;vertical-align:top}
th{color:var(--muted);font-weight:700}
textarea{width:100%;min-height:90px;border:2px solid var(--ink);border-radius:12px;padding:10px;font-size:16px;font-family:inherit;background:var(--soft);color:var(--ink);resize:vertical}
label.q{display:block;font-weight:800;margin:14px 0 6px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:8px 18px;border-radius:99px;font-size:14px;font-weight:700;opacity:0;transition:opacity .2s;pointer-events:none;z-index:9}
.toast.on{opacity:1}
canvas{width:100%;height:auto;border-radius:14px;border:2.5px solid var(--ink)}
.center{text-align:center}
.foot{text-align:center;font-size:12px;color:var(--muted);margin-top:28px}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
@media (prefers-reduced-motion:no-preference){.bob{animation:bob 2.4s ease-in-out infinite}}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<div class="toast" id="toast"></div>
<script>
const DATA = {"qs": [{"id": "D1", "dim": "D", "obj": "上司", "scene": "不同意", "key": true, "stem": "主管在會議上提了一個你覺得行不通的做法，問大家有沒有意見。", "opts": [{"t": "「這個做法我覺得行不通，時程排不下。」", "v": "1"}, {"t": "「我有個疑慮，時程可能排不下，要不要先算一下？」", "v": "2"}, {"t": "「方向我同意，想確認一下時程，大家覺得來得及嗎？」", "v": "3"}, {"t": "會議上先不講，會後再私下找他聊。", "v": "4"}]}, {"id": "D2", "dim": "D", "obj": "同事", "scene": "請求", "key": false, "stem": "同事答應今天給你的資料還沒來，你明天就要用。", "opts": [{"t": "「資料今天能給我嗎？我明天要用。」", "v": "1"}, {"t": "「資料大概幾點會好？我明天一早要用。」", "v": "2"}, {"t": "「最近很忙吧～那份資料如果有進度，可以先給我看看。」", "v": "3"}, {"t": "先等等，下班前還沒來再說。", "v": "4"}]}, {"id": "D3", "dim": "D", "obj": "下屬", "scene": "糾正", "key": false, "stem": "新人交來的報告，格式錯了好幾處。", "opts": [{"t": "「格式錯了，第 2、5、7 頁照範本改。」", "v": "1"}, {"t": "「整體不錯，有幾個格式要照範本改，我標出來了。」", "v": "2"}, {"t": "「辛苦了！我們有一份範本，下次可以對照看看。」", "v": "3"}, {"t": "自己先改好，之後找機會再跟他提範本的事。", "v": "4"}]}, {"id": "D4", "dim": "D", "obj": "客戶", "scene": "拒絕", "key": true, "stem": "客戶要求加一個合約裡沒有的項目，還希望不另外收費。", "opts": [{"t": "「這不在合約範圍內，要做的話需要另外報價。」", "v": "1"}, {"t": "「這個項目合約沒有包含，我先估個費用給您參考。」", "v": "2"}, {"t": "「我理解這個需求，我回去評估怎麼安排比較好，再跟您說。」", "v": "3"}, {"t": "「收到，我們這邊研究一下。」之後再想辦法。", "v": "4"}]}, {"id": "D5", "dim": "D", "obj": "伴侶", "scene": "抱怨", "key": false, "stem": "另一半又把髒衣服丟在沙發上，這週第三次了。", "opts": [{"t": "「衣服又丟沙發了，拿去洗衣籃。」", "v": "1"}, {"t": "「這週第三次了，我希望你可以直接放洗衣籃。」", "v": "2"}, {"t": "「沙發上的衣服是要洗的嗎？」", "v": "3"}, {"t": "自己先收掉，等他心情好的時候再提。", "v": "4"}]}, {"id": "D6", "dim": "D", "obj": "家人", "scene": "拒絕", "key": false, "stem": "長輩打電話要你這個週末回家吃飯，但你已經跟朋友約好了。", "opts": [{"t": "「這週不行，我已經有約了，下週回去。」", "v": "1"}, {"t": "「這週剛好跟朋友約了，下週回去好不好？」", "v": "2"}, {"t": "「這週喔……我看一下，好像有點事，再跟你說。」", "v": "3"}, {"t": "「好啊，那我看朋友那邊能不能改時間。」", "v": "4"}]}, {"id": "D7", "dim": "D", "obj": "朋友", "scene": "不同意", "key": false, "stem": "朋友興奮地說要報名一個很貴的課程，問你覺得怎樣，但你覺得不值得。", "opts": [{"t": "「我覺得不值得，那個價錢太高了。」", "v": "1"}, {"t": "「先說我覺得有點貴，你有比較過別家嗎？」", "v": "2"}, {"t": "「聽起來不錯耶，你最想從裡面學到什麼？」", "v": "3"}, {"t": "「你開心最重要！」心裡的疑慮先不講。", "v": "4"}]}, {"id": "D8", "dim": "D", "obj": "網路陌生人", "scene": "不同意", "key": false, "stem": "你在別人的貼文底下，看到一則留言內容明顯有錯。", "opts": [{"t": "直接留言指出哪裡錯，附上正確資料。", "v": "1"}, {"t": "留言：「補充一下，這部分我查到的資料不太一樣……」", "v": "2"}, {"t": "留言：「這部分好像有其他說法，有興趣可以查查看。」", "v": "3"}, {"t": "不留言，滑過去。", "v": "4"}]}, {"id": "R1", "dim": "R", "obj": "上司", "scene": "請求", "key": false, "stem": "你想跟主管爭取下個月多一個人手。", "opts": [{"t": "「我算過，現在的工作量比上一季多了四成，一個人做不完。」", "v": "1"}, {"t": "「工作量變多了，照現在的人力會延誤交期，多一個人比較穩。」", "v": "2"}, {"t": "「最近大家都很拚，有點撐不住，多一個人大家能喘口氣。」", "v": "3"}, {"t": "「我真的很擔心團隊有人會累倒，想替大家爭取看看。」", "v": "4"}]}, {"id": "R2", "dim": "R", "obj": "朋友", "scene": "安慰建議", "key": false, "stem": "朋友失戀很難過，問你他是不是哪裡做錯了。", "opts": [{"t": "「我們把事情順一遍，看看哪個環節卡住了。」", "v": "1"}, {"t": "「有些地方也許可以做得更好，但不是全部都是你的錯。」", "v": "2"}, {"t": "「你現在一定很難受，先別急著找錯。」", "v": "3"}, {"t": "「你那時候為他做了好多，我都看在眼裡。」", "v": "4"}]}, {"id": "R3", "dim": "R", "obj": "客戶", "scene": "說服", "key": false, "stem": "客戶在兩個方案間猶豫，你想推薦比較貴的那個。", "opts": [{"t": "「貴的那個每月多兩千，但能省下一個人力，半年就回本。」", "v": "1"}, {"t": "「長期算下來，貴的那個比較划算，我把數字整理給您。」", "v": "2"}, {"t": "「之前選這個方案的客戶，後來都說比較省心。」", "v": "3"}, {"t": "「我自己比較放心推薦這個，因為我知道您很在意出錯。」", "v": "4"}]}, {"id": "R4", "dim": "R", "obj": "伴侶", "scene": "不同意", "key": false, "stem": "另一半想把家裡的車換新，你覺得沒必要。", "opts": [{"t": "「這台才開五年，保養一年不到一萬，現在換不划算。」", "v": "1"}, {"t": "「車還能開，先把錢留著比較保險。」", "v": "2"}, {"t": "「我知道你想開得舒服一點，但現在花大錢我有點不安。」", "v": "3"}, {"t": "「每次講到花大錢我就會緊張，你可以先跟我說你為什麼想換嗎？」", "v": "4"}]}, {"id": "R5", "dim": "R", "obj": "家人", "scene": "說服", "key": false, "stem": "你想說服爸媽去做健康檢查。", "opts": [{"t": "「到了這個年紀有補助，提早發現比較好處理。」", "v": "1"}, {"t": "「做個檢查，有問題早點知道，總比拖著好。」", "v": "2"}, {"t": "「你們健健康康的，我在外面才放心。」", "v": "3"}, {"t": "「想到你們可能不舒服卻沒說，我就睡不好。」", "v": "4"}]}, {"id": "R6", "dim": "R", "obj": "同事", "scene": "被質疑", "key": true, "stem": "同事在群組問你，你負責的部分為什麼拖了兩天。", "opts": [{"t": "「延遲是因為上游資料晚了兩天才到，紀錄我貼在下面。」", "v": "1"}, {"t": "「上游資料晚到，所以順延，新的時間是週四。」", "v": "2"}, {"t": "「讓大家等真的很抱歉，我這兩天也很急。」", "v": "3"}, {"t": "「我知道大家都在等，我心裡很過意不去，週四一定給。」", "v": "4"}]}, {"id": "R7", "dim": "R", "obj": "網路陌生人", "scene": "說服", "key": false, "stem": "網友在討論「下班後該不該回主管訊息」，你想留言說你的看法。", "opts": [{"t": "附上相關規定和調查數字，說明你的立場。", "v": "1"}, {"t": "列出兩三個理由，講清楚你為什麼這樣想。", "v": "2"}, {"t": "講你自己遇過的一次經驗。", "v": "3"}, {"t": "說出你對「下班還被找」的心情，讓有同感的人一起共鳴。", "v": "4"}]}, {"id": "R8", "dim": "R", "obj": "下屬", "scene": "交辦", "key": false, "stem": "你要請團隊成員接一個很趕的案子。", "opts": [{"t": "「這案子三週要交，我拆成四段，你負責第二段。」", "v": "1"}, {"t": "「時間很趕，但做完對明年的預算很有幫助。」", "v": "2"}, {"t": "「我知道最近大家很累，這個案子我會一起扛。」", "v": "3"}, {"t": "「這件事交給你我最放心，我很需要你。」", "v": "4"}]}, {"id": "H1", "dim": "H", "obj": "同事", "scene": "被稱讚", "key": false, "stem": "同事在群組誇你這次簡報做得很好。", "opts": [{"t": "「謝謝，大家一起準備的。」", "v": "1"}, {"t": "「謝謝！這次真的有花時間準備。」", "v": "2"}, {"t": "「謝謝，熬夜換來的，黑眼圈可以作證。」", "v": "3"}, {"t": "「請叫我簡報之神（不要太認真）。」", "v": "4"}]}, {"id": "H2", "dim": "H", "obj": "朋友", "scene": "閒聊", "key": false, "stem": "朋友傳來一張他做菜失敗、燒焦的照片。", "opts": [{"t": "「怎麼了？火太大嗎？」", "v": "1"}, {"t": "「還好嗎？下次火轉小一點。」", "v": "2"}, {"t": "「看起來很有……煙燻風味。」", "v": "3"}, {"t": "「這不是菜，這是考古出土的文物吧。」", "v": "4"}]}, {"id": "H3", "dim": "H", "obj": "上司", "scene": "道歉", "key": true, "stem": "你寄錯檔案給主管，要傳訊息更正。", "opts": [{"t": "「抱歉，剛剛的檔案寄錯了，正確的是這份。」", "v": "1"}, {"t": "「抱歉，剛剛手太快寄錯了，這份才對！」", "v": "2"}, {"t": "「剛剛那份是平行時空的版本，這份才是正確的。」", "v": "3"}, {"t": "「剛剛那份請當作沒看到（遮眼），這份才是正本。」", "v": "4"}]}, {"id": "H4", "dim": "H", "obj": "伴侶", "scene": "小衝突", "key": false, "stem": "你們為了晚餐吃什麼僵持不下，氣氛有點悶。", "opts": [{"t": "「那你決定吧，我都可以。」", "v": "1"}, {"t": "「我們各提一個，用猜拳決定。」", "v": "2"}, {"t": "「不然讓冰箱決定，打開看到什麼就吃什麼。」", "v": "3"}, {"t": "「再僵下去只能吃空氣了，空氣我請客。」", "v": "4"}]}, {"id": "H5", "dim": "H", "obj": "客戶", "scene": "被催促", "key": false, "stem": "客戶等你回覆等了一天，傳來「還在嗎？」", "opts": [{"t": "「抱歉晚回，以下是您問的資料。」", "v": "1"}, {"t": "「抱歉讓您久等了！資料整理好了，請參考。」", "v": "2"}, {"t": "「在的！剛剛被資料淹沒，終於爬出來了。」", "v": "3"}, {"t": "「在！剛去跟報表打了一架，現在帶著戰利品回來。」", "v": "4"}]}, {"id": "H6", "dim": "H", "obj": "家人", "scene": "被念", "key": false, "stem": "長輩在家族群組問你：「怎麼最近都不回家？」", "opts": [{"t": "「最近工作比較忙，下個月回去。」", "v": "1"}, {"t": "「最近比較忙，下個月一定回去，想你們。」", "v": "2"}, {"t": "「我也很想回去，可是工作不放我走。」", "v": "3"}, {"t": "「我在外面努力賺錢，準備回去發紅包啦。」", "v": "4"}]}, {"id": "H7", "dim": "H", "obj": "網路陌生人", "scene": "閒聊", "key": false, "stem": "你看到一則大家在抱怨週一的貼文，想留言。", "opts": [{"t": "「真的，週一總是特別累。」", "v": "1"}, {"t": "「週一最難，撐過去就好。」", "v": "2"}, {"t": "「我的身體已經上班，靈魂還在週六。」", "v": "3"}, {"t": "「建議週一改名叫週六第二集。」", "v": "4"}]}, {"id": "H8", "dim": "H", "obj": "下屬", "scene": "宣布", "key": true, "stem": "你要在團隊群組宣布：這週六要加班。", "opts": [{"t": "「通知：本週六需要加班，時間九點到下午三點。」", "v": "1"}, {"t": "「這週六需要加班，九點到三點，辛苦大家了。」", "v": "2"}, {"t": "「這週六要加班，我知道大家心都碎了。九點到三點，便當我負責。」", "v": "3"}, {"t": "「各位，週六的行程要先改成『公司一日遊』了，九點到三點，便當我請。」", "v": "4"}]}, {"id": "S1", "dim": "S", "obj": "同事", "scene": "被質疑", "key": true, "stem": "開會時，同事說你的提案「根本沒想清楚」。", "opts": [{"t": "「謝謝提醒，我會再想想。」", "v": "1"}, {"t": "「可以說說是哪個部分嗎？我再補充。」", "v": "2"}, {"t": "「哪裡沒想清楚？我可以一項一項說明。」", "v": "3"}, {"t": "「成本、時程、風險都算過了，你有不同的數字，我們可以直接比。」", "v": "4"}]}, {"id": "S2", "dim": "S", "obj": "網路陌生人", "scene": "被質疑", "key": false, "stem": "你的貼文底下，有人留言說你講的完全錯。", "opts": [{"t": "不回，或回「每個人看法不同」。", "v": "1"}, {"t": "「謝謝你的意見，我的想法是這樣……」", "v": "2"}, {"t": "「你說錯的是哪一句？我有附資料來源。」", "v": "3"}, {"t": "把他的論點拆開，一條一條回覆。", "v": "4"}]}, {"id": "S3", "dim": "S", "obj": "客戶", "scene": "被殺價", "key": true, "stem": "客戶說：「別家便宜三成，你們能不能也降？」", "opts": [{"t": "「我回去問問看能不能調。」", "v": "1"}, {"t": "「價格可以聊，我先說明一下我們多做了哪些。」", "v": "2"}, {"t": "「我們的價格包含售後和保固，比的時候要一起算。」", "v": "3"}, {"t": "「便宜三成，那邊少了哪些項目？建議您先問清楚再比。」", "v": "4"}]}, {"id": "S4", "dim": "S", "obj": "上司", "scene": "不公平", "key": false, "stem": "主管在大會上，把你做的成果說成是另一個同事的。", "opts": [{"t": "算了，不想為這種事起衝突。", "v": "1"}, {"t": "私下跟主管說：「下次報告時，可以提一下我負責的部分嗎？」", "v": "2"}, {"t": "私下找主管說清楚：「那個成果是我做的，我希望能被正確記下來。」", "v": "3"}, {"t": "會後當場補充說明，自己負責了哪些部分。", "v": "4"}]}, {"id": "S5", "dim": "S", "obj": "朋友", "scene": "不同意", "key": false, "stem": "朋友很篤定地轉傳一則你知道是假的健康偏方。", "opts": [{"t": "不回，或回個貼圖。", "v": "1"}, {"t": "「這個我好像看過有人說不準，你要不要再查一下？」", "v": "2"}, {"t": "「這則是假的，查核網站有澄清過，連結給你。」", "v": "3"}, {"t": "「這是假的，照做可能有危險，先不要再傳了。」", "v": "4"}]}, {"id": "S6", "dim": "S", "obj": "伴侶", "scene": "被質疑", "key": false, "stem": "吵架時另一半說「你每次都這樣」，但你覺得不是。", "opts": [{"t": "先不辯，等他氣消再說。", "v": "1"}, {"t": "「我知道你很不舒服，但『每次』可能有點不公平。」", "v": "2"}, {"t": "「哪幾次？我們把事情講清楚。」", "v": "3"}, {"t": "「不是每次，上週跟上上週我都有做到，這樣說不公平。」", "v": "4"}]}, {"id": "S7", "dim": "S", "obj": "下屬", "scene": "糾正", "key": false, "stem": "團隊成員第三次錯過期限，還說「最近比較忙」。", "opts": [{"t": "「辛苦了，有困難隨時跟我說。」", "v": "1"}, {"t": "「我理解你忙，下次來不及的話，可以早點告訴我嗎？」", "v": "2"}, {"t": "「這是第三次了，我們需要談一下怎麼避免。」", "v": "3"}, {"t": "「三次了。大家都忙，期限就是期限，下次再延，我得重新分配工作。」", "v": "4"}]}, {"id": "S8", "dim": "S", "obj": "家人", "scene": "被質疑", "key": false, "stem": "長輩說你現在的工作「沒前途」。", "opts": [{"t": "「嗯嗯，我知道你是擔心我。」", "v": "1"}, {"t": "「我知道你擔心，我自己有在規劃，放心。」", "v": "2"}, {"t": "「你覺得哪裡沒前途？我跟你說說我在做什麼。」", "v": "3"}, {"t": "「這是我想清楚的決定，我會負責，希望你相信我。」", "v": "4"}]}, {"id": "P1", "dim": "P", "obj": "上司", "scene": "請求", "key": false, "stem": "主管下班前傳：「明天可以幫我多做一份報表嗎？」", "opts": [{"t": "「好，明天中午前給您。」", "v": "答"}, {"t": "「是哪一份報表？格式跟上次一樣嗎？」", "v": "問"}, {"t": "「明天有點滿，可能要後天。」", "v": "答"}, {"t": "「要什麼時候用？我看一下明天的排程。」", "v": "問"}]}, {"id": "P2", "dim": "P", "obj": "朋友", "scene": "安慰建議", "key": false, "stem": "朋友傳：「我好煩，不知道要不要搬家。」", "opts": [{"t": "「想搬就搬，住得開心最重要。」", "v": "答"}, {"t": "「怎麼了？現在住的哪裡讓你不舒服？」", "v": "問"}, {"t": "「先別急，房子的事慢慢看。」", "v": "答"}, {"t": "「你最煩的是錢、地點，還是別的？」", "v": "問"}]}, {"id": "P3", "dim": "P", "obj": "同事", "scene": "被催促", "key": false, "stem": "同事在群組問：「那件事處理得怎樣了？」", "opts": [{"t": "「還在處理，週四前會好。」", "v": "答"}, {"t": "「你說的是哪一件？報價還是排程？」", "v": "問"}, {"t": "「快好了！」", "v": "答"}, {"t": "「你那邊急著要用嗎？我看要不要先給你一部分。」", "v": "問"}]}, {"id": "P4", "dim": "P", "obj": "客戶", "scene": "被質疑", "key": false, "stem": "客戶說：「你們上次交的東西有問題。」", "opts": [{"t": "「抱歉，我馬上請同事檢查。」", "v": "答"}, {"t": "「方便說是哪個部分嗎？我好確認。」", "v": "問"}, {"t": "「我們交件前都有檢查，我再看一次。」", "v": "答"}, {"t": "「是哪一天交的那批？可以截圖給我嗎？」", "v": "問"}]}], "types": [{"name": "可靠的顧問", "combo": ["直接", "講理", "正經", "溫和"], "one":   return `<svg width="${size}" height="${size}" viewBox="0 0 120 120" role="img" aria-label="文字 DNA 小泡泡">${helix}${tail}<rect x="18" y="24" width="84" height="72" rx="30" fill="${c}" stroke="${ink}" stroke-width="4"/>${brows}${eyes}${mouth}</svg>`;
}

function buildOrder(){
  const by = d => DATA.qs.filter(q=>q.dim===d);
  const D=by("D"),R=by("R"),H=by("H"),S=by("S"),P=by("P");
  const out=[];
  for(let i=0;i<8;i++){ out.push(D[i],R[i],H[i],S[i]); if(i%2===1) out.push(P[(i-1)/2]); }
  return out.map(q=>{ const idx=q.opts.map((_,j)=>j); for(let j=idx.length-1;j>0;j--){const k=Math.floor(Math.random()*(j+1));[idx[j],idx[k]]=[idx[k],idx[j]]} return {id:q.id,shuffle:idx}; });
}
let S = store.get("dna_quiz") || null;
function save(){ store.set("dna_quiz",S); }
function toast(t){ const el=$("#toast"); el.textContent=t; el.classList.add("on"); setTimeout(()=>el.classList.remove("on"),1600); }
async function copy(text){
  try{ await navigator.clipboard.writeText(text); toast("已複製"); }
  catch(e){ const ta=document.createElement("textarea"); ta.value=text; document.body.appendChild(ta); ta.select(); try{document.execCommand("copy"); toast("已複製");}catch(_){toast("複製失敗，請手動選取");} ta.remove(); }
}

function intro(){

function quiz(){
  const n=S.order.length, it=S.order[S.i], q=DATA.qs.find(x=>x.id===it.id);
  const picked=S.ans[q.id];
  const pct=S.i/n;
  const face = pct<.34?{D:0,R:0,H:0,S:0}:pct<.67?{D:1,R:1,H:0,S:0}:{D:0,R:1,H:1,S:0};
  $("#app").innerHTML = `
  <div class="qhead"><span>第 ${S.i+1} / ${n} 題</span><span>${S.i>0?'<a href="#" id="back">← 上一題</a>':''}</span></div>
  <div class="progress"><i style="width:${pct*100}%"></i></div>
  <div class="card">
    <div class="row" style="justify-content:space-between;align-items:flex-start;flex-wrap:nowrap">
      <div class="tags"><span class="tag">${esc(q.obj)}</span><span class="tag s">${esc(q.scene)}</span></div>
      ${mascot({color:"#ffd23f",sides:face},52)}
    </div>
    <div class="stem">${esc(q.stem)}</div>
    ${it.shuffle.map(j=>`<button class="opt${picked===j?' on':''}" data-j="${j}">${esc(q.opts[j].t)}</button>`).join("")}
  </div>
  <p class="small center">選你實際最可能說的那句</p>`;
  document.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{
    S.ans[q.id]=+b.dataset.j; b.classList.add("on");
    setTimeout(()=>{ if(S.i<n-1){S.i++; save(); quiz(); window.scrollTo(0,0);} else { S.done=true; save(); result(); window.scrollTo(0,0);} },180);
  });
  if($("#back")) $("#back").onclick=e=>{e.preventDefault(); S.i--; save(); quiz();};
}

function score(){
  const val = q => q.opts[S.ans[q.id]].v;
  const res={dims:{},objs:{},asker:0};
  for(const d of ["D","R","H","S"]){
    const qs=DATA.qs.filter(q=>q.dim===d);
    const vs=qs.map(q=>+val(q)); const avg=vs.reduce((a,b)=>a+b,0)/vs.length;
    const keys=qs.filter(q=>q.key).map(q=>+val(q)); const kavg=keys.reduce((a,b)=>a+b,0)/keys.length;
    const band = avg>=2.25 && avg<=2.75;
    let right;
    if(!band) right = avg>2.5;
    else right = kavg>2.5 ? true : kavg<2.5 ? false : (avg>2.5);
    const leftPct = Math.round(100 - (avg-1)/3*100);
    const lo=[],hi=[];
    qs.forEach(q=>{ const v=+val(q); (v<=2?lo:hi).push(q.obj); res.objs[q.obj]=res.objs[q.obj]||{}; res.objs[q.obj][d]= v<=2?DIMS[d][0]:DIMS[d][1]; });
    res.dims[d]={avg,leftPct,right,band,lo,hi,side:DIMS[d][right?1:0]};
  }
  res.asker = DATA.qs.filter(q=>q.dim==="P").filter(q=>val(q)==="問").length;
  res.isAsker = res.asker>=3;
  const combo=["D","R","H","S"].map(d=>res.dims[d].side);
  res.typeIndex = DATA.types.findIndex(t=>t.combo.join()===combo.join());
  res.type = DATA.types[res.typeIndex];
  res.sides = {D:+res.dims.D.right,R:+res.dims.R.right,H:+res.dims.H.right,S:+res.dims.S.right};
  res.color = TYPE_COLORS[res.typeIndex];
  return res;
}

function sceneText(r){
  return ["D","R","H","S"].filter(d=>r.dims[d].band).map(d=>{
    const x=r.dims[d]; const [L,R]=DIMS[d];
    const a=x.lo.length?`對${x.lo.join("、")}偏${L}`:""; const b=x.hi.length?`對${x.hi.join("、")}偏${R}`:"";
    return `${L}／${R}：${[a,b].filter(Boolean).join("，")}`;
  });
}

  ${scenes.length?`<div class="card"><h2>${N()}你會看場合</h2>${scenes.map(s=>`<p style="margin:0 0 6px">${esc(s)}</p>`).join("")}<p class="small" style="margin:6px 0 0">對不同的人換一套講法很正常。你的類型是照壓力比較大的場合怎麼反應來歸的。</p></div>`:""}
  <div class="card"><h2>${N()}你對不同的人怎麼說話</h2><table><tr><th>對象</th><th>傾向</th></tr>${objRows}</table><p class="small" style="margin:8px 0 0">初步結果：每一格只有一題。</p></div>

  <div class="card"><h2>${N()}你的結果卡</h2><canvas id="cv" width="1080" height="1350"></canvas>
    <div class="row" style="margin-top:12px"><button class="btn" id="dl">存成圖片</button><button class="btn alt" id="share">複製分享文字</button></div></div>

  <div class="card" style="background:#e6faf6"><h2>${N()}想看 AI 用你的口吻回訊息？</h2>
    <p style="margin:0">這份報告看的是你偏哪一型；你的用詞、口頭禪、回話的順序，選擇題測不出來，而這些正是讓文字不像 AI 的關鍵。再答 4 題，複製一段文字貼到你自己的 Claude，就能看到示範。</p>

  OPEN.forEach((_,i)=>$("#op"+i).oninput=e=>{S.open=S.open||{};S.open[i]=e.target.value;save();});
  const header = () => {

  const answers = () => OPEN.map((o,i)=>`${i+1}. ${o.k}：${(($("#op"+i).value)||"").trim()||"（沒答）"}`).join("\n");
  $("#cpClaude").onclick=()=>{

    copy(`請你當我的「文字 DNA」助理。以下是我在一個說話風格測驗的結果，和我回答的 4 題。

【測驗結果】
類型：${h.type}
${h.pct}（百分比是偏左端的程度）
看場合：${h.scene}

【我的回答】（第 2–4 題是假設的情境，不是我的近況）
${answers()}

請你：

寫的時候要像我，也不要有 AI 痕跡：

function wrapText(ctx,text,x,y,maxW,lh,center){
  const lines=[]; let line="";
  for(const ch of text){ const test=line+ch; if(ctx.measureText(test).width>maxW && line && !"，。、？！：；）」…".includes(ch)){ lines.push(line); line=ch; } else line=test; }
  if(line) lines.push(line);
  for(const l of lines){ ctx.fillText(l, center?x-ctx.measureText(l).width/2:x, y); y+=lh; }
  return y;
}
function rr(x,X,Y,W,H,R){ x.beginPath(); x.moveTo(X+R,Y); x.arcTo(X+W,Y,X+W,Y+H,R); x.arcTo(X+W,Y+H,X,Y+H,R); x.arcTo(X,Y+H,X,Y,R); x.arcTo(X,Y,X+W,Y,R); x.closePath(); }
function drawCard(r,t){
  const c=$("#cv"), x=c.getContext("2d"), F='"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif', ink="#231f1a";
  const paint=(img)=>{
    x.fillStyle="#fff7e8"; x.fillRect(0,0,1080,1350);
    x.fillStyle=ink; rr(x,66,66,960,1230,48); x.fill();
    x.fillStyle=r.color; rr(x,54,54,960,1230,48); x.fill(); x.lineWidth=7; x.strokeStyle=ink; x.stroke();
    x.fillStyle=ink; x.font=`700 38px ${F}`; x.fillText("我的文字 DNA",110,140);
    if(img) x.drawImage(img,390,170,300,300);
    x.fillStyle=ink; x.font=`900 86px ${F}`; let y=wrapText(x,t.name,540,560,840,100,true);
    if(r.isAsker){ x.font=`800 40px ${F}`; const w=x.measureText("先問型").width+48; x.fillStyle="#ffd23f"; rr(x,540-w/2,y-46,w,64,32); x.fill(); x.lineWidth=4; x.strokeStyle=ink; x.stroke(); x.fillStyle=ink; x.fillText("先問型",540-w/2+24,y); y+=60; }
    x.fillStyle="#3c352c"; x.font=`500 42px ${F}`; y=wrapText(x,t.one,540,y+40,820,62,true);
    y=Math.max(y+20,800); const gap=Math.min(88,(1140-y)/4);
    for(const d of ["D","R","H","S"]){
      const [L,R]=DIMS[d], p=r.dims[d].leftPct;
      x.fillStyle=ink; x.font=`800 36px ${F}`; x.fillText(L,120,y); const rw=x.measureText(R).width; x.fillText(R,960-rw,y);
      x.fillStyle="#fff7e8"; rr(x,120,y+18,840,26,13); x.fill(); x.lineWidth=4; x.strokeStyle=ink; x.stroke();
      x.beginPath(); x.arc(120+840*(100-p)/100,y+31,22,0,Math.PI*2); x.fillStyle=DCOL[d]; x.fill(); x.lineWidth=5; x.stroke();
      y+=gap;
    }
    x.fillStyle=ink; x.font=`800 36px ${F}`; x.fillText("你是哪一種說話的人？",110,1212);
    x.font=`500 26px ${F}`; x.fillText(QUIZ_URL.replace("https://",""),110,1254);
  };
  paint(null);
  const svg=mascot({color:"#fff7e8",sides:r.sides},300);
  const img=new Image(); img.onload=()=>paint(img);
  img.src="data:image/svg+xml;charset=utf-8,"+encodeURIComponent(svg.replace("<svg ",'<svg xmlns="http://www.w3.org/2000/svg" '));
}

if(S && S.done) result(); else intro();
